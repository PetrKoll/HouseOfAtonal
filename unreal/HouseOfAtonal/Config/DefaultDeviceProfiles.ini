[Windows DeviceProfile]
DeviceType=Windows
BaseProfileName=

; PC VR texture budget for the 16 GB RTX 5070 Ti workstation.
; Keep authored UI and project-specific groups untouched. Vendor assets mostly
; use World even for foliage, so this cap prevents imported 8K sets from
; exhausting the pool while preserving 4K base/detail maps for close surfaces.
+CVars=r.Streaming.PoolSize=2500
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
